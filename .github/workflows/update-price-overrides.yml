name: Update price overrides

on:
  workflow_dispatch: {}
  schedule:
    # Daily at 9:15 AM UTC
    - cron: "15 9 * * *"

env:
  # GitHub Actions is deprecating Node.js 20 for JavaScript-based actions in 2026.
  # This opts the workflow into Node.js 24 for action runtimes.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: update-price-overrides
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate price-overrides.js
        run: node scripts/update-price-overrides.mjs

      - name: Commit changes (if any)
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-overrides.js
          git commit -m "Update price overrides"
          git push
