name: Update Price Overrides

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-price-overrides:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh price overrides
        run: node scripts/update-price-overrides.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- price-overrides.js; then
            echo "No price changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price-overrides.js
          git commit -m "Update price overrides"
          git push
